name: CPU offline contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q
      - run: python -m build --wheel
      - name: Install wheel outside source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/rdnascope-wheel"
          "$RUNNER_TEMP/rdnascope-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rdnascope-wheel/bin/rdnascope" --data-dir "$RUNNER_TEMP/offline-state" doctor
          "$RUNNER_TEMP/rdnascope-wheel/bin/python" - <<'PY'
          import sys, rdnascope
          from pathlib import Path
          from rdnascope.core import Settings, SCHEMA_NAMES, schema, minimal_identity
          from rdnascope.storage import Registry
          from rdnascope.analysis import analyze
          from rdnascope.records import Records
          for name in SCHEMA_NAMES: assert schema(name)['type'] == 'object'
          fixture = Path('wheel-fixture.json')
          fixture.write_text('{"traceEvents":[{"ph":"X","name":"fixture","pid":1,"tid":1,"ts":0,"dur":2}]}')
          settings = Settings(data_dir=Path('wheel-state').resolve())
          identity = minimal_identity('wheel-demo'); identity['role'] = 'fixture'
          Registry(settings).register(identity, [{'path': str(fixture.resolve())}])
          analyze(settings, 'wheel-demo', 'wheel-analysis')
          assert Records(settings).verify_tree('case', 'wheel-analysis')['status'] == 'verified'
          assert 'torch' not in sys.modules
          print(rdnascope.__version__, len(SCHEMA_NAMES))
          PY
