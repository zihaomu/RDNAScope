name: Explicit RDNA qualification
on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Basename of an operator-reviewed plan in the runner's private plan directory
        required: true
        type: string
      plan_sha256:
        description: SHA256 of that exact plan (including physical cards and budgets)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rdnascope-exclusive-gpu-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, rdna-qualified]
    timeout-minutes: 60
    env:
      RDNASCOPE_GPU_PROFILE: '${{ vars.RDNASCOPE_GPU_PROFILE }}'
      RDNASCOPE_GPU_PROFILE_SHA256: '${{ vars.RDNASCOPE_GPU_PROFILE_SHA256 }}'
      RDNASCOPE_GPU_PLAN_ROOT: '${{ vars.RDNASCOPE_GPU_PLAN_ROOT }}'
      REVIEWED_PLAN_ID: '${{ inputs.plan_id }}'
      REVIEWED_PLAN_SHA256: '${{ inputs.plan_sha256 }}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install CPU control package in a fresh environment
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/rdnascope-control-$GITHUB_RUN_ID"
          "$RUNNER_TEMP/rdnascope-control-$GITHUB_RUN_ID/bin/python" -m pip install .
      - name: Run the exact private plan with resource guards
        shell: bash
        run: |
          "$RUNNER_TEMP/rdnascope-control-$GITHUB_RUN_ID/bin/python" - <<'PY'
          import json, os, re
          from pathlib import Path
          from rdnascope.core import Settings, atomic_json, file_hash, read_json
          from rdnascope.workloads import external
          name = os.environ['REVIEWED_PLAN_ID']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,100}', name):
              raise SystemExit('Invalid plan ID')
          for key in ('RDNASCOPE_GPU_PROFILE', 'RDNASCOPE_GPU_PROFILE_SHA256', 'RDNASCOPE_GPU_PLAN_ROOT'):
              if not os.environ.get(key): raise SystemExit('Runner qualification binding is unconfigured')
          profile = Path(os.environ['RDNASCOPE_GPU_PROFILE']).resolve(strict=True)
          root = Path(os.environ['RDNASCOPE_GPU_PLAN_ROOT']).resolve(strict=True)
          plan_path = (root / (name + '.json')).resolve(strict=True)
          if not plan_path.is_relative_to(root): raise SystemExit('Plan escaped private root')
          if file_hash(profile) != os.environ['RDNASCOPE_GPU_PROFILE_SHA256']:
              raise SystemExit('Profile identity mismatch')
          if file_hash(plan_path) != os.environ['REVIEWED_PLAN_SHA256']:
              raise SystemExit('Reviewed plan identity mismatch')
          plan = read_json(plan_path)
          if type(plan.get('timeout_seconds')) is not int or not 0 < plan['timeout_seconds'] <= 2700:
              raise SystemExit('Plan exceeds CI time budget')
          settings = Settings(profile)
          if not settings.adapters.get(plan.get('adapter'), {}).get('gpu'):
              raise SystemExit('This job requires a configured GPU qualification adapter')
          result = external(settings, plan)
          atomic_json(Path(os.environ['RUNNER_TEMP']) / ('qualification-' + os.environ['GITHUB_RUN_ID'] + '.json'), result)
          summary = {'status': result['status'], 'adopted': result['adopted'],
                     'scope': 'Owned action result only; feature gates require separate evidence'}
          print(json.dumps(summary))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          if result['status'] != 'passed': raise SystemExit(2)
          PY
