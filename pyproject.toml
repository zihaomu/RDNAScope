[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rdnascope"
version = "0.3.0a1"
description = "Thin, bounded RDNA trace capture, reading and official Perfetto viewing"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rdnascope = "rdnascope.cli:main"

[project.urls]
Repository = "https://github.com/zihaomu/RDNAScope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdnascope = ["schemas/thin-v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
