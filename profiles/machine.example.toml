schema_version = 1

[tools]
rocprofv3 = "/absolute/path/to/rocprofv3"
rocpd_command = ["/absolute/path/to/python", "/absolute/path/to/rocpd"]
trace_processor = "/absolute/path/to/trace_processor_shell"

[capture]
backend = "rocm_native"
profile = "scope"
timeout_seconds = 120
max_output_bytes = 1073741824

[context]
id = "local-workload"
